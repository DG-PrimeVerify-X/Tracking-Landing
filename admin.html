<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DG BHAI 9X — Analytics</title>
<style>
body{margin:0;background:#080808;color:#eee;font:14px Arial;padding:20px}.wrap{max-width:1100px;margin:auto}h1{font-size:26px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button{background:#151515;color:#fff;border:1px solid #333;border-radius:10px;padding:11px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#121212;border:1px solid #242424;border-radius:16px;padding:16px}.n{font-size:28px;font-weight:800;margin-top:6px}.muted{color:#888}.ok{color:#68e0a2}.bad{color:#ff8b8b}pre{white-space:pre-wrap;color:#bbb}
</style></head><body><div class="wrap">
<h1>DG BHAI 9X — Analytics</h1>
<div class="top"><button onclick="loadStats()">Refresh Stats</button></div>
<div class="grid">
<div class="card">Visits<div class="n" id="visits">—</div></div>
<div class="card">Unique Visitors<div class="n" id="unique">—</div></div>
<div class="card">Telegram Clicks<div class="n" id="clicks">—</div></div>
<div class="card">CTR<div class="n" id="ctr">—</div></div>
<div class="card">Likely Real<div class="n ok" id="real">—</div></div>
<div class="card">Suspicious<div class="n bad" id="sus">—</div></div>
</div>
<div class="card" style="margin-top:20px"><b>Source data</b><pre id="sources">—</pre></div>
<p class="muted">For persistent analytics, connect /api routes to a database.</p>
</div>
<script>
async function loadStats(){
 const r=await fetch("/api/stats"); const s=await r.json();
 for(const [id,val] of Object.entries({visits:s.visits,unique:s.uniqueVisitors,clicks:s.clicks,ctr:s.ctr+"%",real:s.likelyReal,sus:s.suspicious}))
   document.getElementById(id).textContent=val;
 document.getElementById("sources").textContent=JSON.stringify({sources:s.sources,clickSources:s.clickSources},null,2);
}
loadStats();
</script></body></html>
